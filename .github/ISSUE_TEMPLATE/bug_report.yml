name: Bug Report
description: Create a report to help us improve LiveTranslate
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Open the app
        2. Click 'Start Listening'
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version (or git commit hash)
    validations:
      required: true
